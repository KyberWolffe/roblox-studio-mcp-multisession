[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-studio-mcp-v2-prototype"
version = "0.3.0rc1"
description = "Explicitly targeted concurrent Roblox Studio MCP sessions for Apple Silicon macOS"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
studio-mcp-v2-hub = "studio_mcp_v2.hub:main"
studio-mcp-v2 = "studio_mcp_v2.mcp_stdio:main"
roblox-studio-mcp-v2 = "studio_mcp_v2.lifecycle:main"
studio-mcp-v2-mock = "studio_mcp_v2.mock_studio:main"

[tool.setuptools.packages.find]
include = ["studio_mcp_v2*"]
