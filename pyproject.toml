[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-studio-mcp-multisession"
version = "0.4.0rc7"
description = "Explicitly targeted concurrent Roblox Studio sessions for Apple Silicon macOS"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
roblox-studio-mcp-multisession-hub = "studio_mcp_v2.hub:main"
roblox-studio-mcp-multisession-stdio = "studio_mcp_v2.mcp_stdio:main"
roblox-studio-mcp-multisession = "studio_mcp_v2.lifecycle:main"
roblox-studio-mcp-multisession-mock = "studio_mcp_v2.mock_studio:main"
# Compatibility aliases retained for existing development environments.
studio-mcp-v2-hub = "studio_mcp_v2.hub:main"
studio-mcp-v2 = "studio_mcp_v2.mcp_stdio:main"
roblox-studio-mcp-v2 = "studio_mcp_v2.lifecycle:main"
studio-mcp-v2-mock = "studio_mcp_v2.mock_studio:main"

[tool.setuptools.packages.find]
include = ["studio_mcp_v2*"]
